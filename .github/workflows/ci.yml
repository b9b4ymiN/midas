name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  plugin-checks:
    name: Plugin manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check every SKILL.md is registered in plugin.json
        run: npm run check-skills

      - name: Check plugin.json version matches package.json
        run: npm run check-plugin-version
